name: Auto-Fix Prose and Open PR
on:
  push:
    branches:
      - 'develop' # Triggers when you push to develop

jobs:
  vale:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vale Linter
        uses: errata-ai/vale-action@v2
        with:
          # github-check works on BOTH commits and PRs.
          # It adds annotations directly to the GitHub files view.
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}