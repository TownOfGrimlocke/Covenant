name: Auto-Fix Typos and Open PR
on:
  push:
    branches:
      - 'developer'

jobs:
  fix-and-pr:
    # Crucial safety check: Ensures the action ONLY runs if the push came from a real person,
    # and completely skips running if a GitHub Bot or Action caused the push event.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: developer

      # Rest of the steps remain exactly the same...
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install and Run Auto-Corrector
        run: |
          pip install codespell
          codespell --write-changes || true

      - name: Get Short Commit ID
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Pull Request with Proposed Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: automatic spelling corrections for commit ${{ steps.vars.outputs.sha_short }}"
          title: "🤖 Automated Spelling Fixes (${{ steps.vars.outputs.sha_short }})"
          body: |
            This PR contains automatic documentation corrections based on your latest push to `developer`.
            
            ### 📝 Next Steps:
            1. Open this PR on GitHub.
            2. Click the **Copilot Actions ✨** button and select **Summary** to generate your localized change log.
            3. Review the adjustments and click **Merge** to sync the fixes back into your local workflow!
          base: developer  
          branch: spelling-${{ steps.vars.outputs.sha_short }}
          delete-branch: true 
