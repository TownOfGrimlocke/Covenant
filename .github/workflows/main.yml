name: Auto-Fix Prose and Open PR
on:
  push:
    branches:
      - 'Develop' # Triggers when you push to Develop
  pull_request:
    branches:
      - 'Develop'

jobs:
  fix-and-pr:
    # Safety check: ensures the action only runs if a human pushed the code
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Runs Vale against your project using your .vale.ini rules
      - name: Run Vale Prose Linter
        uses: errata-ai/vale-action@v2
        with:
          files: '.' # Checks all md and mdx files in the repo
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-annotations' || 'github-check' }}
        env:
          # Authorizes the action to post results back to GitHub
          GITHUB_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}